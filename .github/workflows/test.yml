name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Release and Deploy runs this as its gate
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Same command as the agents' stop hook
    - name: Check
      run: npm run check

    - name: Audit runtime dependencies
      run: npm audit --omit=dev --audit-level=high
