name: Build Android TWA (AAB & APK)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android App Bundle & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web App (Vite PWA)
        run: |
          npm ci
          npm run build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;36.1.0" "platforms;android-36" || true

      - name: Restore Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring keystore from secret..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > mymeds-release-key.keystore
          elif [ -f "mymeds-release-key.keystore" ]; then
            echo "Using existing repository keystore..."
          else
            echo "Restoring preconfigured release keystore..."
            echo "" | base64 --decode > mymeds-release-key.keystore
          fi

      - name: Install Bubblewrap CLI & Setup Config
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          bubblewrap doctor

      - name: Scaffold Android TWA Project
        run: |
          # Start background local server for dist
          python3 -m http.server 8080 --directory dist &
          SERVER_PID=$!
          sleep 2

          # Backup original twa-manifest.json
          cp twa-manifest.json twa-manifest.orig.json

          # Temporarily replace URLs with local server
          sed -i 's|https://the3ver.github.io/mymeds/pwa-512x512.png|http://localhost:8080/pwa-512x512.png|g' twa-manifest.json
          sed -i 's|https://the3ver.github.io/mymeds/maskable-icon-512x512.png|http://localhost:8080/maskable-icon-512x512.png|g' twa-manifest.json
          sed -i 's|https://the3ver.github.io/mymeds/manifest.webmanifest|http://localhost:8080/manifest.webmanifest|g' twa-manifest.json

          # Run bubblewrap update to generate project files and icons
          bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json

          # Kill background server
          kill $SERVER_PID || true

          # Restore production twa-manifest.json
          cp twa-manifest.orig.json twa-manifest.json
          rm twa-manifest.orig.json

          # Sync manifest-checksum.txt with production twa-manifest.json to avoid interactive prompts during build
          node -e "const crypto=require('crypto'), fs=require('fs'); fs.writeFileSync('manifest-checksum.txt', crypto.createHash('sha1').update(fs.readFileSync('twa-manifest.json')).digest('hex'));"

      - name: Build TWA Android App Bundle (.aab) & APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'mymeds-playstore-key' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'mymeds-playstore-key' }}
        run: |
          bubblewrap build --skipPwaValidation
          if [ -f "app-release-signed.apk" ]; then
            cp app-release-signed.apk MyMeds-release.apk
          elif [ -f "app-release-unsigned-aligned.apk" ]; then
            cp app-release-unsigned-aligned.apk MyMeds-release.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk MyMeds-release.apk
          fi
          if [ -f "app-release-bundle.aab" ]; then
            cp app-release-bundle.aab MyMeds-release.aab
          elif [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab MyMeds-release.aab
          fi

      - name: Upload AAB and APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mymeds-android-release
          path: |
            *.aab
            *.apk

      - name: Attach APK and AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MyMeds-release.apk
            MyMeds-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
